services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: concert-app
    env_file:
      - .env.production
    depends_on:
      - concert-postgres
      - concert-redis
      - concert-minio
    restart: unless-stopped
    ports:
      - "8080:8080"

  concert-postgres:
    image: postgres:18.3-bookworm
    container_name: concert-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./out/pgdata:/var/lib/postgresql
    restart: unless-stopped

  concert-redis:
    image: redis:8.2.5-bookworm
    container_name: concert-redis
    restart: unless-stopped

  concert-minio:
    image: minio/minio:latest
    container_name: concert-minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGINS}
    volumes:
      - ./out/miniodata:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  concert-minio-setup:
    image: minio/mc
    depends_on:
      - concert-minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set local_minio http://concert-minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
      /usr/bin/mc mb --ignore-existing local_minio/${S3_BUCKET_NAME};
      /usr/bin/mc anonymous set public local_minio/${S3_BUCKET_NAME};
      exit 0;
      "

  nginx:
    image: nginx:1.27
    container_name: concert-nginx
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped
